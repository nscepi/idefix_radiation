[Grid]
X1-grid    1  0.05  256  l   20.0
X2-grid    2  0.0   240  s+  1.4707963267948966  50  u  1.5707963267948966
X3-grid    1  0.0   1    u   6.28318530718

[TimeIntegrator]
CFL         0.4
tstop       1.e10
first_dt    1.e-10
nstages     2
debug       1

[Hydro]
solver    hll
gamma     1.6666666
mu        0.6
# [Rad]
# nFrequencies         1
# solver_rad       hll_rad
# reduced_c        1.e-4
# kappa   constant  0.  0.
# xi      constant  0.
# source               full_implicit

[Gravity]
potential    central
Mcentral     7.
gravCst      1.

[Units]
velocity    1.663e7
length      4.8e11
density     1.e-10

[Setup]
RIC              1.
T0               1.e4
rho0             1.e-12
rhoindex         2.
epsilon          0.03
density_floor    1.e-18
TX               1.4e7
Lstar            2.646e37
kappaX           0.4
tstart           0.
ttrans           1.e3

[Boundary]
X1-beg    outflow
X1-end    outflow
X2-beg    axis
X2-end    userdef
X3-beg    periodic
X3-end    periodic

[Output]
vtk        2.6e-2
dmp        2.6e-1
log        100
uservar    FX      xi  Gcompton  GX  -Lbt  tau
