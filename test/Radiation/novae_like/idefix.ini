[Grid]
X1-grid    1  1.   128  l   100.0
X2-grid    3  0.0  240  s+  1.3707963267948966  320  u  1.7707963267948965  240  s-  3.141592653589793
X3-grid    1  0.0  1    u   6.28318530718

[TimeIntegrator]
CFL         0.4
tstop       1.e10
first_dt    1.e-10
nstages     2
debug       1

[Hydro]
solver       hll
gamma        1.42
mu           2.35
viscosity    explicit  userdef

[Rad]
nFrequencies    1
solver_rad      hll_rad
reduced_c       1.e-4
kappa           kramers        5.e24  1.  1.
xi              constant       0.
source          full_implicit

[Gravity]
potential    central
Mcentral     5.4e-4
gravCst      1.

[Units]
velocity    1.49598e10
length      8.8e8
density     1.e-30

[Setup]
R0               1.
T0               1.e5
rho0             1.e-4
rhoindex         2.
rhomin           1.e-8
alphaMRI         1.e-1
epsilon          0.05
density_floor    1.e-8

[Boundary]
X1-beg    userdef
X1-end    userdef
X2-beg    axis
X2-end    axis
X3-beg    periodic
X3-end    periodic

[Output]
vtk    1.e3
dmp    1.e3
log    10000
