[Grid]
X1-grid    1  -0.5  280  u   0.5
X2-grid    1  0.  80  u   0.3
X3-grid    1  -50.0  50  u   50.0

[TimeIntegrator]
CFL         0.4
tstop       10.
first_dt    1.e-6
nstages     2
debug       1

[Hydro]
solver    hllc
gamma     1.6666666666
mu        1.

[Rad]
nFrequencies         1
solver_rad	     hll_rad
reduced_c	     1.0
kappa	kramers		0.1	1.	290. 
xi      constant     0.

[Units]
velocity        29979245800.0
length          1.
density         1.

[Setup]
rho1            1.e3
Tinj            1740.
x02             0.01
y02             0.0036

[Boundary]
X1-beg    userdef
X1-end    outflow
X2-beg    reflective
X2-end    outflow
X3-beg    outflow
X3-end    outflow

[Output]
vtk        10.
dmp        10.
log        1000
