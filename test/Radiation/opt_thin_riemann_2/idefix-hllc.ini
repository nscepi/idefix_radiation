[Grid]
X1-grid    1  -20.0  256  u   20.0
X2-grid    1  -20.0  256  u   20.0
X3-grid    1  -20.0  256  u   20.0

[TimeIntegrator]
CFL         0.5
tstop       20.
first_dt    1.e-6
nstages     2

[Hydro]
solver    hll
csiso     constant   1.e-3

[Rad]
nFrequencies         1
solver_rad	hllc_rad
reduced_c	     1.

[Boundary]
X1-beg    outflow_pluto
X1-end    outflow_pluto
X2-beg    outflow
X2-end    outflow
X3-beg    periodic
X3-end    periodic

[Output]
vtk        20.0
dmp        20.0
log        10
