[Grid]
X1-grid    1  -20.0  256  u   20.0
X2-grid    1  -20.0  256  u   20.0
X3-grid    1  -20.0  256  u   20.0

[TimeIntegrator]
CFL         0.4
tstop       2000.
first_dt    1.e-6
nstages     2
fixed_dt    1.e-1

[Hydro]
solver    hll
csiso     constant   1.e-3

[Rad]
nFrequencies         1
solver_rad	hll_rad
reduced_c	     0.01

[Boundary]
X1-beg    outflow
X1-end    outflow
X2-beg    outflow
X2-end    outflow
X3-beg    periodic
X3-end    periodic

[Output]
vtk        2000.0
dmp        2000.0
log        10
