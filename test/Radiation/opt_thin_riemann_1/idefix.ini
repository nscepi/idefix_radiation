[Grid]
X1-grid    1  -20.0  256  u   20.0
X2-grid    1  -20.0  256  u   20.0
X3-grid    1  -20.0  256  u   20.0

[TimeIntegrator]
CFL         0.5
tstop       100.
first_dt    1.e-6
nstages     2

[Hydro]
solver    hll
csiso     constant   1.0

[Rad]
nFrequencies         1
solver_rad	hll_rad

[Boundary]
X1-beg    outflow
X1-end    outflow
X2-beg    outflow
X2-end    outflow
X3-beg    periodic
X3-end    periodic

[Output]
uservar    ER   FRX  FRY
vtk        1.0
dmp        1.0
log        0.1
