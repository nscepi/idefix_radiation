[Grid]
X1-grid    1  0.0  1000  u   1.e3

[TimeIntegrator]
CFL         0.4
tstop       1.e-10
first_dt    1.e-14
nstages     2
debug       1
fixed_dt    2.e-14

[Hydro]
solver    hll
gamma     1.42
mu 	  2.35

[Rad]
nFrequencies         1
solver_rad       hll_rad
reduced_c        1.
kappa   constant     1.e-3  1.e-3
xi      constant     1.e-3
source               full_implicit
relativist_correction   true

[Units]
velocity          1.
length          1.
density         1.

[Setup]
BigC            1.e2
BigP            1.e3

[Boundary]
X1-beg    periodic
X1-end    periodic

[Output]
vtk        1.e-12
dmp        1.e-12
log        100
