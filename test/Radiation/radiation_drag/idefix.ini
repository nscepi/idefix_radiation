[Grid]
X1-grid    1  0.0  2  u  1.e2

[TimeIntegrator]
CFL         0.4
tstop       5.e-6
first_dt    1.e-10
nstages     2
debug       1

[Hydro]
solver    hll
gamma     1.42
mu        1.

[Rad]
nFrequencies    1
solver_rad      hll_rad
reduced_c       1.
kappa           constant       1.e-1  1.e-1
xi              constant       1.e-1
source          full_implicit

[Units]
velocity    1.
length      1.e-5
density     3.505e3

[Setup]
BigC    1.e2
BigP    1.e3

[Boundary]
X1-beg    periodic
X1-end    periodic

[Output]
vtk    1.e-8
dmp    1.e-8
log    100
