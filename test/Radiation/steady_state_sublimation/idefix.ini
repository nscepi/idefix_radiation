[Grid]
X1-grid    1  0.05                512  l  10.0
X2-grid    1  1.1853981633974483  256  u  1.956194490192345
X3-grid    1  0.0                 1    u  6.28318530718

[TimeIntegrator]
CFL            0.4
tstop          1.e6
first_dt       1.e-10
max_runtime    0.5
nstages        2
debug          1

[Hydro]
solver       hll
gamma        1.42
mu           2.35
viscosity    explicit  userdef

[Gravity]
potential    central
Mcentral     3.76e-8
gravCst      1.

[Rad]
nFrequencies    1
solver_rad      hll_rad
reduced_c       1.e-4
kappa           userfunc
xi              constant       0.
source          full_implicit
irr             userfunc       1.80882e11  4300.

[Units]
velocity    1.49598e10
length      1.49598e13
density     4.e-28

[Setup]
R0               0.05
T0               200.
rho0             1.e-8
rhoindex         2.
rhomin           1.e-15
alphaMRI         1.e-3
alphaDZ          1.e-3
alphawidth       25.
epsilon          0.02
Tsub             2000.
rhos             1.
rhos_index       0.0195
Twidth           150.
f0               1.e-3
kappa_star       1.3e3
kappa_gas        1.e-3
density_floor    1.e-15
TMRI             900

[Boundary]
X1-beg    userdef
X1-end    userdef
X2-beg    outflow
X2-end    outflow
X3-beg    periodic
X3-end    periodic

[Output]
vtk        1.e3
dmp        1.e8
log        1000
uservar    tau   divF  A1  dV

[Python]
script               steady_state_sublimation
initflow_function    init
