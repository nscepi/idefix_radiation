[Grid]
X1-grid    1  1.0  128  l   10.0
X2-grid    1  1.0  128  l   10.0
X3-grid    1  1.0  128  l   10.0

[TimeIntegrator]
CFL         0.5
tstop       20.0
first_dt    1.e-3
nstages     1

[Hydro]
solver    hll
csiso     constant   1.0

[Radiation]
solver    hll
nFrequencies         1

[Boundary]
X1-beg    outflow
X1-end    outflow
X2-beg    outflow
X2-end    outflow
X3-beg    periodic
X3-end    periodic

[Output]
uservar    ER   FRX  FRY
vtk        2.0
dmp        2.0
log        1
