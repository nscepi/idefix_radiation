[Grid]
X1-grid    1  2.0  128  l   10.0
X2-grid    1  2.0  128  l   10.0
X3-grid    1  2.0  128  l   10.0

[TimeIntegrator]
CFL         0.5
tstop       10.
first_dt    1.e-4
nstages     2

[Hydro]
solver    hll
csiso     constant   1.0

[Rad]
nFrequencies         1
solver_rad	lfr_rad

[Boundary]
X1-beg    outflow
X1-end    outflow
X2-beg    outflow
X2-end    outflow
X3-beg    periodic
X3-end    periodic

[Output]
uservar    ER   FRX  FRY
vtk        0.1
dmp        3.
log        100.
