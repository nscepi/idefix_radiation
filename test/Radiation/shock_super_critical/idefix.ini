[Grid]
X1-grid    1  0.0  2048  u   7.
X2-grid    1  -20.0  256  u   20.0
X3-grid    1  -20.0  256  u   20.0

[TimeIntegrator]
CFL         0.25
tstop       1.e6
first_dt    1.e-10
nstages     2
debug       1

[Hydro]
solver    hllc
gamma     1.4

[Rad]
nFrequencies         1
solver_rad	     hllc_rad
reduced_c	     0.0001
radsource	     Tvar
kappa		     3.9e-1
xi		     0.

[Setup]
unit_velocity        2.99e10
unit_length          1.e10
unit_mass            1.e20

[Boundary]
X1-beg    reflective
X1-end    outflow_pluto
X2-beg    outflow
X2-end    outflow
X3-beg    periodic
X3-end    periodic

[Output]
vtk        7.5e3
dmp        7.5e3
log        200
