[Grid]
X1-grid    1  -0.5  50  u   0.5
X2-grid    1  -0.5  50  u   0.5
X3-grid    1  -50.0  100  u   50.0

[TimeIntegrator]
CFL         0.4
tstop       1.e-2
first_dt    1.e-8
nstages     2
debug       1

[Hydro]
solver    hlld
gamma     1.3333333
mu        1.

[Setup]
w         0.1
T0        1.05e-7
rho0      1.
prs_out   0.1
prs_in    1.e3
B0        28.2094791773878

[Rad]
nFrequencies    1.
solver_rad      hll_rad
reduced_c       1.
kappa    constant   3.4e-7
xi       constant   0.
source              full_implicit

[Units]
velocity    2.99e6
length      2.56e-2
density     1.15e2 

[Boundary]
X1-beg    outflow
X1-end    outflow
X2-beg    outflow
X2-end    outflow
X3-beg    outflow
X3-end    outflow

[Output]
vtk        1.e-2
dmp        1.e-2
log        1000
