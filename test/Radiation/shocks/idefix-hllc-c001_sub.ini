[Grid]
X1-grid    1  0.0    256  u  7.
X2-grid    1  -20.0  256  u  20.0
X3-grid    1  -20.0  256  u  20.0

[TimeIntegrator]
CFL         0.4
tstop       3.8e4
first_dt    1.e-10
nstages     2

[Hydro]
solver    hllc
gamma     1.4
mu        1.

[Rad]
nFrequencies    1
solver_rad      hllc_rad
reduced_c       1.e-2
kappa           constant       0.39  0.39
xi              constant       0.
source          full_implicit

[Units]
velocity    1.e10
length      1.e10
density     1.e-10

[Boundary]
X1-beg    reflective
X1-end    userdef
X2-beg    outflow
X2-end    outflow
X3-beg    periodic
X3-end    periodic

[Setup]
rho0    7.78e-10
T0      10.
vx1     -6.0e5

[Output]
vtk    3.8e4
dmp    3.8e4
log    10000
