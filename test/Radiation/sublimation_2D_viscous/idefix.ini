[Grid]
X1-grid    1  0.05  64  l   10.0
X2-grid    1   1.4   64  u   1.741592653589793 
X3-grid    1  0.0  1  u   6.28318530718 

[TimeIntegrator]
CFL         0.4
tstop       3.1536e6
first_dt    1.e-10
nstages     2
debug       1

[Hydro]
solver    hll
gamma     1.42
mu 	  2.35
viscosity    explicit  userdef

[Rad]
nFrequencies         1
solver_rad       hll_rad
reduced_c        0.00001
kappa   userfunc
xi      constant     0.
source               full_implicit
irr    userfunc    1.80882e11    4300.

[Gravity]
potential    central
Mcentral     3.76e-8
gravCst      1.

[Units]
velocity          1.49598e10
length          1.49598e13
density         1.e-30

[Setup]
R0              0.05
T0              200.
rho0		1.e-9
rhomin		1.e-18
alphaMRI        0.1
alphaDZ         1.e-3
epsilon       0.05
Tsub          2000.
rhos          1.
rhos_index    0.0195
Twidth        150.
f0            1.e-3
kappa_star    1.3e3
kappa_gas     1.e-3
density_floor 1.e-18

[Boundary]
X1-beg    outflow
X1-end    outflow
X2-beg    outflow
X2-end    outflow
X3-beg    periodic
X3-end    periodic

[Output]
vtk        10000.
dmp        10000.
log        10000
