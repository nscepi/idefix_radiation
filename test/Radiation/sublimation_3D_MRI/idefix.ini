[Grid]
X1-grid    1  0.05  1024  l   5.0
X2-grid    3  0  256  s+   1.4707963267948966   256  u   1.6707963267948965  256  s-  3.141592653589793
X3-grid    1  0.0  32  u   0.6283185307179586
coarsening static X3

[TimeIntegrator]
CFL         0.4
CFL_max_var      1.1
tstop       3.5e5
first_dt    1.e-10
nstages     2
check_nan        1
debug       1
maxdivB     1.e-4
max_runtime 1.9

[Hydro]
solver    hlld
resistivity    explicit  userdef
ambipolar      explicit  userdef
gamma     1.42
mu 	  2.35
shockFlattening 2.0
emf       uct_hlld

[Rad]
nFrequencies         1
solver_rad       hll_rad
reduced_c        1.e-3
kappa   userfunc         
xi      constant     0.
source               full_implicit
irr    userfunc    1.80882e11    4300.

[Gravity]
potential    central
Mcentral     3.76e-8
gravCst      1.

[Units]
velocity          1.49598e10
length          1.49598e13
density         1.e-30

[Setup]
R0              0.05
T0              200.
rho0		1.e-8
rhoindex        2.
rhomin		1.e-17
epsilon       0.05
epsilonTop      0.5
diffusivityCap  1.0
Tsub          2000.
rhos          1.
rhos_index    0.0195
kappa_star    1.3e3
kappa_gas     1.e-3
density_floor 1.e-17
TMRI          900
beta            10000
Hideal        4.5
transitionSmoothing  0.5
Tout          1.e1
Twidth        150.
f0            1.e-3

[Boundary]
X1-beg    userdef
X1-end    userdef
X2-beg    axis
X2-end    axis
X3-beg    periodic
X3-end    periodic

[Output]
vtk        6.283185307179586e0
dmp        6.283185307179586e1
analysis   6.283185307179586
log        100
uservar    etaO xA  InvDt columnr columnthup columnthdown kappap kappar
