[Grid]
X1-grid    1  -50.0  200  u   50.0
X2-grid    1  -50.0  201  u   50.0
X3-grid    1  -50.0  50  u   50.0

[TimeIntegrator]
CFL         0.4
tstop       5.e1
first_dt    1.e-10
nstages     2
debug       1

[Hydro]
solver    hllc
gamma     1.6666666666

[Rad]
nFrequencies         1
solver_rad	     hll_rad
reduced_c	     1.
radsource	     Tvar
kappa		     0.
xi		     1.0e-6

[Setup]
unit_velocity        2.99e10
unit_length          2.99e10
unit_mass            1.78e23

[Boundary]
X1-beg    outflow
X1-end    outflow
X2-beg    outflow
X2-end    outflow
X3-beg    outflow
X3-end    outflow

[Output]
vtk        2.5
dmp        2.5
log        1000
