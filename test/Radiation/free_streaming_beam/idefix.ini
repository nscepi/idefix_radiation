[Grid]
X1-grid    1   0.0  150  u    5.0
X2-grid    1   0.0  150  u    5.0
X3-grid    1  -20.0  256  u   20.0

[TimeIntegrator]
CFL         0.4
tstop       70.
first_dt    1.e-6
nstages     2

[Hydro]
solver    hll
csiso     constant   1.0

[Rad]
nFrequencies         1
solver_rad	hllc_rad
reduced_c	     1.
kappa	constant     0.1
xi  	userdef	     1

[Units]
velocity        1.49598e10
length          1.49598e13
density         1.e-30


[Boundary]
X1-beg    outflow
X1-end    outflow
X2-beg    outflow
X2-end    outflow
X3-beg    outflow
X3-end    outflow

[Output]
vtk        70.
dmp        70.
log        1000
