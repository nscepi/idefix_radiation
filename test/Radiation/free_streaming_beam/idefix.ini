[Grid]
X1-grid    1   0.0  300  u    5.0
X2-grid    1   0.0  300  u    5.0
X3-grid    1  -20.0  256  u   20.0

[TimeIntegrator]
CFL         0.4
tstop       7.
first_dt    1.e-6
nstages     2

[Hydro]
solver    hll
csiso     constant   1.0

[Rad]
nFrequencies         1
solver_rad	hllc_rad
shockFlattening		1.

[Boundary]
X1-beg    outflow
X1-end    outflow
X2-beg    outflow
X2-end    outflow
X3-beg    outflow
X3-end    outflow

[Output]
vtk        7.
dmp        7.
log        100
