[Grid]
X1-grid    1   0.0  150  u    5.0
X2-grid    1   0.0  150  u    5.0
X3-grid    1  -20.0  256  u   20.0

[TimeIntegrator]
CFL         0.5
tstop       10.
first_dt    1.e-6
nstages     3

[Hydro]
solver    hll
csiso     constant   1.0

[Rad]
nFrequencies         1
solver_rad	hll_rad

[Boundary]
X1-beg    outflow
X1-end    outflow
X2-beg    outflow
X2-end    outflow
X3-beg    outflow
X3-end    outflow

[Output]
vtk        0.05
dmp        1.0
log        0.1
