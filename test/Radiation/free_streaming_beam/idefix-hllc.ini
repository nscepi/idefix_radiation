[Grid]
X1-grid    1  0.0    150  u  5.0
X2-grid    1  0.0    150  u  5.0
X3-grid    1  -20.0  256  u  20.0

[TimeIntegrator]
CFL          0.4
tstop        5.
first_dt     1.e-12
nstages      2
check_nan    1

[Hydro]
solver    hll
csiso     constant  1.e-1

[Rad]
nFrequencies    1
solver_rad      hllc_rad
reduced_c       1.
kappa           constant       0.  0.
xi              constant       0.
source          full_implicit

[Units]
velocity    1.e10
length      1.
density     1.

[Setup]
RHO       1.e4
ER0       1.e4
Angle     0.78539816339
ERbeam    1.e12
x1beg     0.5
x1end     0.6
x2beg     0.3
x2end     0.44

[Boundary]
X1-beg    outflow
X1-end    outflow
X2-beg    outflow
X2-end    outflow
X3-beg    outflow
X3-end    outflow

[Output]
vtk    5.
dmp    5.
log    1000
