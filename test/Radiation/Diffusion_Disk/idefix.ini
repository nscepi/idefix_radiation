[Grid]
X1-grid    1  -1.0  201  u   1.0
X2-grid    1  -50.0  201  u   50.0
X3-grid    1  -50.0  50  u   50.0

[TimeIntegrator]
CFL         0.4
tstop       3.1536e5
first_dt    1.e-10
nstages     2
debug       1

[Hydro]
solver    hllc
gamma     1.41

[Rad]
nFrequencies         1
solver_rad	     hllc_rad
reduced_c	     0.01
kappa	constant     1.e-1
xi		     0.
mu		     2.35

[Units]
velocity        1.496e10
length          1.496e13
density         1.e-10

[Setup]
epsilon         0.05
alpha           1.e-3
R               5.
T0              1000.
rho0		1.e-10
rhomin		1.e-20

[Boundary]
X1-beg    userdef
X1-end    userdef
X2-beg    outflow
X2-end    outflow
X3-beg    outflow
X3-end    outflow

[Output]
vtk        3.1536e4
dmp        3.1536e4
log        10000
